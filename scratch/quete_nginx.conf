# 1. Основной сайт игры на HTTPS (порт 443)
server {
    listen 443 ssl http2;
    server_name quete.ru www.quete.ru;

    root /var/www/quete;
    index index.php index.html index.htm;

    # Скрытие версии Nginx
    server_tokens off;

    # SSL-сертификаты Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/quete.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quete.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HTTP-заголовки безопасности
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Настройки отдачи файлов игры
    location / {
        try_files $uri $uri/ =404;
    }

    # Защита скрытых системных файлов (.env, .git)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Защита резервных копий SQL и логов от прямого скачивания
    location ~* \.(sql|log)$ {
        deny all;
    }

    # Блокировка конфиденциальных MD-инструкций (кроме README.md)
    location ~* /(DEPLOYMENT_GUIDE_AGENT|USER_VPS_GUIDE|COMPLETED_WORK|GENERAL)\.md$ {
        deny all;
    }

    # Обработка PHP через PHP 8.3-FPM
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Принудительное включение безопасного режима сессионных кук (session.cookie_secure) на сервере
        fastcgi_param PHP_VALUE "session.cookie_secure=1";

        # Скрытие дублирующихся заголовков, отправляемых PHP, так как Nginx устанавливает их сам
        fastcgi_hide_header Strict-Transport-Security;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header Referrer-Policy;
    }
}

# 2. Безопасное SSL-проксирование WebSockets на порту 8888 (WSS)
server {
    listen 8888 ssl;
    server_name quete.ru www.quete.ru;

    # Скрытие версии Nginx
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/quete.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quete.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400; # Соединение не разорвется 24 часа
    }
}

# 3. Автоматический редирект с небезопасного HTTP (порт 80) на HTTPS
server {
    listen 80;
    server_name quete.ru www.quete.ru;

    # Скрытие версии Nginx
    server_tokens off;

    if ($host = www.quete.ru) {
        return 301 https://$host$request_uri;
    }
    if ($host = quete.ru) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
