name: CI

on:
  push:
    branches: [ main, master, dev, develop ]
  pull_request:
    branches: [ main, master, dev, develop ]

jobs:
  backend-ci:
    name: Backend CI (Python & uv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: РџСЂРѕРІРµСЂРєР° СЂРµРїРѕР·РёС‚РѕСЂРёСЏ
        uses: actions/checkout@v4

      - name: РЈСЃС‚Р°РЅРѕРІРєР° uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: РЈСЃС‚Р°РЅРѕРІРєР° Python 3.12
        run: uv python install 3.12

      - name: Р—Р°РїСѓСЃРє С‚РµСЃС‚РѕРІ Р±СЌРєРµРЅРґР°
        run: uv run pytest

  client-ci:
    name: Client CI (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: РџСЂРѕРІРµСЂРєР° СЂРµРїРѕР·РёС‚РѕСЂРёСЏ
        uses: actions/checkout@v4

      - name: РЈСЃС‚Р°РЅРѕРІРєР° Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: РЈСЃС‚Р°РЅРѕРІРєР° Р·Р°РІРёСЃРёРјРѕСЃС‚РµР№ РєР»РёРµРЅС‚Р°
        run: flutter pub get

      - name: РЎС‚Р°С‚РёС‡РµСЃРєРёР№ Р°РЅР°Р»РёР· РєРѕРґР°
        run: flutter analyze

      - name: Р—Р°РїСѓСЃРє С‚РµСЃС‚РѕРІ РєР»РёРµРЅС‚Р°
        run: flutter test

  # РЁР°Р±Р»РѕРЅ СЌС‚Р°РїР° РґРµРїР»РѕСЏ (Р·Р°РєРѕРјРјРµРЅС‚РёСЂРѕРІР°РЅ РґР»СЏ Р±СѓРґСѓС‰РµР№ РёРЅС‚РµРіСЂР°С†РёРё)
