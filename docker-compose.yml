services:
  # Основная реляционная база данных для хранения пользователей, сессий и игровой статистики
  postgres:
    image: postgres:16-alpine
    container_name: quete_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quete_user
      POSTGRES_PASSWORD: quete_password
      POSTGRES_DB: quete_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quete_user -d quete_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # In-memory хранилище для кэширования, очередей и real-time состояний комнат
  redis:
    image: redis:7-alpine
    container_name: quete_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
